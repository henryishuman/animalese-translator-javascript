<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animalese Translator</title>
    <style>
      @font-face {
        font-family: acTitle;
        src: url("fonts/ac_title.ttf");
      }

      @font-face {
        font-family: arialRounded;
        src: url("fonts/arial_rounded.ttf");
      }

      .polka {
        background-image: 
            radial-gradient(rgb(255, 181, 97) 14%, transparent 14%),
            radial-gradient(rgb(255, 181, 97) 14%, transparent 14%);
        background-position: 0px 0px, 96px 96px;
        background-size: 192px 192px;
        background-color: rgb(254, 200, 124);
       }

      body {
        font-family: arialRounded, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffe7b7;
        color: #2d2a26;
      }

      main {
        width: min(90vw, 32rem);
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        padding: 1.5rem;
      }

      h1 {
        margin-top: 0;
        font-family: acTitle;
        text-align: center;
        font-weight: normal;
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      input,
      button {
        font: inherit;
        padding: 0.8rem 1rem;
        border-radius: 8px;
      }

      input {
        border: 1px solid #c9c3b8;
      }

      button {
        border: 0;
        background: #4f7c41;
        color: #ffffff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      p {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body class="polka">
    <main>
      <h1>Animalese Translator</h1>
      <p>This is a rough hack-together of my old animalese translator. I haven't put as much love and care into this as I did the original. As such, please be patient with it. 🖤</p>
      <p>Any issues, please leave a comment on my <a href="https://github.com/henryishuman/animalese-translator-javascript">GitHub page</a>!</p>
      <br />
        <form id="translator-form">
        
        <input
          id="sentence-input"
          type="text"
          placeholder="Type something to hear it in Animalese!"
          value=""
          autocomplete="off"
        />
        <button id="play-button" type="submit">Translate</button>
      </form>
      <p id="status" aria-live="polite">Ready.</p>
    </main>

    <script src="./letters-data.js"></script>
    <script src="./animalese.js"></script>
    <script>
      const form = document.getElementById("translator-form");
      const input = document.getElementById("sentence-input");
      const button = document.getElementById("play-button");
      const status = document.getElementById("status");
      const player = Animalese.createBrowserPlayer();

      function setBusy(isBusy, message) {
        button.disabled = isBusy;
        status.textContent = message;
      }

      form.addEventListener("submit", async function handleSubmit(event) {
        event.preventDefault();

        const sentence = input.value.trim();
        if (!sentence) {
          status.textContent = "Enter some text first.";
          input.focus();
          return;
        }

        try {
          setBusy(true, "Generating Animalese...");
          await player.playSentence(sentence);
          setBusy(false, "Playing.");
        } catch (error) {
          setBusy(false, error.message);
        }
      });
    </script>
  </body>
</html>
